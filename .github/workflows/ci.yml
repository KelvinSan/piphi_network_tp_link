name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: current

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        working-directory: current
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run compile check
        working-directory: current
        env:
          PYTHONPATH: src
        run: python -m compileall -q src tests scripts

      - name: Validate metadata JSON
        working-directory: current
        run: |
          python -m json.tool src/manifest.json >/dev/null
          python -m json.tool src/behaviors.json >/dev/null

      - name: Validate release script
        working-directory: current
        run: |
          python3 -m py_compile scripts/release.py
          python3 scripts/release.py --bump patch --docker-image piphinetwork/tp-link-kasa --dry-run

      - name: Run tests
        working-directory: current
        env:
          PYTHONPATH: src
        run: pytest

      - name: Build Docker image
        working-directory: current
        run: docker build -t piphi-tp-link-kasa-smoke .
